name: MereFilmStudio
options:
  bundleIdPrefix: run.mere
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CLANG_ENABLE_MODULES: YES
    ARCHS: arm64
    VALID_ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  FilmStudioCore:
    type: framework
    platform: macOS
    sources:
      - Sources/FilmStudioCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.mere.filmstudio.core
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
  GhosttyBridge:
    type: framework
    platform: macOS
    sources:
      - Sources/GhosttyBridge
    dependencies:
      - framework: .build/dependencies/GhosttyKit.xcframework
        embed: false
        codeSign: false
      - sdk: Carbon.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.mere.filmstudio.ghostty
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: "$(inherited) -lstdc++"
    scheme:
      testTargets: []
  MereFilmStudio:
    type: application
    platform: macOS
    sources:
      - App
      - path: Generated/GhosttyResources/terminfo
        buildPhase: resources
        type: folder
      - path: Generated/GhosttyResources/ghostty
        buildPhase: resources
        type: folder
    dependencies:
      - target: FilmStudioCore
      - target: GhosttyBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.mere.filmstudio
        PRODUCT_NAME: Mere Film Studio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mere Film Studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright Mere
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - FilmStudioCoreTests
  FilmStudioCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/FilmStudioCoreTests
    dependencies:
      - target: FilmStudioCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.mere.filmstudio.tests
