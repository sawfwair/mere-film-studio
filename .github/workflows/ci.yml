name: ci

on:
  pull_request:
  push:
    branches:
      - main

# A newer push supersedes a queued or running build of the same ref; the
# macOS runner pool is too small to spend on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-15
    # The cold GhosttyKit build takes ~15 minutes; everything else is small.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: brew install swiftlint xcodegen

      - name: Restore pinned GhosttyKit
        id: ghostty
        uses: actions/cache/restore@v4
        with:
          path: |
            .build/dependencies/GhosttyKit.xcframework
            Generated/GhosttyResources
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Vendor/ghostty-version.json') }}

      - name: Build pinned GhosttyKit
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: |
          brew install anyzig
          ./scripts/bootstrap-ghostty.sh

      # Saved immediately, not in a post step: one successful bootstrap must
      # survive even when a later lint, test, or build step fails, or every
      # run pays the whole zig build again and the queue never drains.
      - name: Save pinned GhosttyKit
        if: steps.ghostty.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build/dependencies/GhosttyKit.xcframework
            Generated/GhosttyResources
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Vendor/ghostty-version.json') }}

      # check.sh is split into steps here so a hang or failure names its
      # stage instead of eating the whole job timeout (swift test has hung
      # at startup on runners before — the step bound turns that into a
      # fast, attributable failure).
      - name: Lint
        timeout-minutes: 10
        run: swiftlint lint --strict --quiet --config .swiftlint.yml

      # Every test here uses swift-testing; the XCTest harness leg that
      # `swift test` still spawns has hung indefinitely on runner Xcodes
      # (zero output after "Build complete!"), so skip it outright.
      - name: Package tests
        timeout-minutes: 20
        run: swift test --disable-xctest --enable-code-coverage --verbose

      - name: Build application
        timeout-minutes: 40
        run: |
          ./scripts/generate-project.sh
          xcodebuild \
            -project MereFilmStudio.xcodeproj \
            -scheme MereFilmStudio \
            -configuration Debug \
            -derivedDataPath .build/xcode-derived \
            CODE_SIGNING_ALLOWED=NO \
            build
